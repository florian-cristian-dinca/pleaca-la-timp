# Rebuilds graph.json from OpenStreetMap every month - free on GitHub Actions (public repo).
name: build-graph
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # 03:17 UTC on the 1st of each month
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyosmium
        run: pip install osmium
      - name: Download OSM extract (Geofabrik, Romania)
        run: curl -sSL -o romania.osm.pbf https://download.geofabrik.de/europe/romania-latest.osm.pbf
      - name: Build graph.json (Bucharest + Ilfov, tertiary and above)
        run: python osm/osm_import.py romania.osm.pbf graph.json --bbox 44.25,25.80,44.72,26.40 --min-class tertiary
      - name: Commit graph.json
        run: |
          git config user.name "graph-bot"
          git config user.email "graph-bot@users.noreply.github.com"
          git add graph.json
          git diff --cached --quiet || git commit -m "Rebuild graph.json from OpenStreetMap ($(date -u +%F))"
          git push
