<script>
(function () {
  function spinner() {
    if (document.getElementById('updov')) return;
    var st = document.createElement('style'); st.textContent = '@keyframes pltspin{to{transform:rotate(360deg)}}';
    document.head.appendChild(st);
    var o = document.createElement('div'); o.id = 'updov';
    o.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(242,239,233,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:800 18px system-ui,sans-serif;color:#1b1f24';
    o.innerHTML = '<div style="width:56px;height:56px;border:6px solid #d6e2f5;border-top-color:#1d4ed8;border-radius:50%;animation:pltspin .9s linear infinite"></div><div>Se actualizează aplicația…</div><div style="font:600 14px system-ui,sans-serif;color:#6b7177">Durează câteva secunde. Datele dumneavoastră rămân.</div>';
    (document.body || document.documentElement).appendChild(o);
  }
  function repair() {
    spinner();
    var p = [new Promise(function (r) { setTimeout(r, 900); })]; // rotița rămâne vizibilă cel puțin o clipă
    try { if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); })); } catch (e) { }
    try { if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })); } catch (e) { }
    Promise.all(p).then(function () { location.reload(); }, function () { location.reload(); });
  }
  window.__pltRepair = repair;
  function show(msg) {
    if (document.getElementById('errbox')) return;
    var d = document.createElement('div'); d.id = 'errbox';
    d.style.cssText = 'position:fixed;left:12px;right:12px;top:70px;z-index:99;background:#fff;color:#1b1f24;border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);font:15px/1.4 system-ui,sans-serif';
    d.innerHTML = '<b style="font-size:17px">Aplicația nu s-a încărcat complet</b><p style="margin:8px 0">De obicei se rezolvă cu o actualizare.</p><button id="errfix" style="width:100%;border:none;border-radius:14px;padding:14px;background:#15803d;color:#fff;font-weight:800;font-size:16px">Actualizează aplicația</button><p style="margin:10px 0 0;font-size:12px;color:#6b7177;word-break:break-word">Detaliu tehnic: ' + String(msg).replace(/[<>&]/g, '') + '</p>';
    (document.body || document.documentElement).appendChild(d);
    document.getElementById('errfix').onclick = repair;
  }
  window.addEventListener('error', function (e) { show((e.message || 'eroare') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason || 'promisiune respinsă'); });
  window.__pltShowError = show;
})();
</script>

<script>
'use strict';
const $ = id => document.getElementById(id);
const fmt = m => { m = Math.round(m); const d = ((m % 1440) + 1440) % 1440; return String(Math.floor(d / 60)).padStart(2, '0') + ':' + String(d % 60).padStart(2, '0'); };
const parseT = s => { const [h, m] = (s || '00:00').split(':').map(Number); return h * 60 + m; };
const dstr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dayStr = k => { const d = new Date(); d.setDate(d.getDate() + k); return dstr(d); };
const todayStr = () => dayStr(0);
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const mins = x => Math.max(0, Math.round(x)) + ' min';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const WD = ['duminică', 'luni', 'marți', 'miercuri', 'joi', 'vineri', 'sâmbătă'];
const wday = date => new Date(date + 'T12:00:00Z').getUTCDay();
const dayLabel = date => date === todayStr() ? 'azi' : date === dayStr(1) ? 'mâine, ' + WD[wday(date)] : WD[wday(date)] + ', ' + +date.slice(8) + '.' + date.slice(5, 7);
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.opacity = 0, 2800); }

/* ---------- Stare ---------- */
const KEY = 'pleaca_la_timp_v2';
function fresh() { return { consent: false, home: null, work: null, habits: [], lead: 30, evening: true, eveningAt: '21:00', trips: [], segObs: [], reports: [], live: null, pack: null, net: null, pid: 'P-' + Math.random().toString(36).slice(2, 8).toUpperCase(), seen: {} }; }
let S = fresh();
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(fresh(), JSON.parse(r)); } catch (e) { }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, S, { net: null }))); } catch (e2) { } } }

let NET, M, M0;
const DEFAULT_RESTR = [{ id: 'r-20261106-dn1', segId: 'OTO>cPOD', closedLanes: 1, startDate: '2026-11-06', startMin: 360, endDate: null, endMin: 0, source: 'raportată', note: 'o bandă închisă pe DN1, înainte de Centură' }];
function rebuild() {
  NET = JSON.parse(JSON.stringify(S.net || window.__OSM_GRAPH__ || E.buildSkeleton()));
  if (S.pack && S.pack.edgeEdits) for (const [k, v] of Object.entries(S.pack.edgeEdits)) if (NET.edges[k]) Object.assign(NET.edges[k], v);
  const restr = ((S.pack && S.pack.restrictions) || DEFAULT_RESTR).concat(S.reports.filter(r => r.closedLanes)).filter(r => NET.edges[r.segId]);
  M = new E.Model(NET, restr);      // ce știm pentru ziua respectivă
  M0 = new E.Model(NET, []);        // o zi obișnuită, fără restricții – pentru „neobișnuit”
  FC = PLT.createForecaster({ E, net: NET, model: M, model0: M0, pack: S.pack, weatherFor, version: (S.pack ? S.pack.version : '') + '|' + S.reports.length });
}
const LR = () => (S.pack && S.pack.lr ? S.pack : null);
const pname = id => NET.nodes[id] ? (NET.nodes[id].place || NET.nodes[id].name) : '?';
const weatherFor = date => (S.pack && S.pack.weather && S.pack.weather[date]) || 'senin';

function placeOptions() {
  let list = NET.places && NET.places.length >= 2 ? NET.places.map(p => [p.node, p.name, NET.nodes[p.node] && NET.nodes[p.node].zone === 'B' ? 'București' : 'Ilfov']) : Object.entries(NET.nodes).filter(([, n]) => n.zone !== 'C').map(([i, n]) => [i, n.name, n.zone === 'B' ? 'București' : 'Ilfov']);
  const g = {}; list.forEach(x => (g[x[2]] = g[x[2]] || []).push(x));
  return Object.entries(g).map(([k, a]) => `<optgroup label="${k}">${a.sort((x, y) => x[1].localeCompare(y[1], 'ro')).map(([i, n]) => `<option value="${i}">${esc(n)}</option>`).join('')}</optgroup>`).join('');
}


/* ---------- Căutare loc (în loc de liste lungi) ---------- */
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const KIND = { city: 'oraș', town: 'oraș', village: 'localitate', suburb: 'cartier', quarter: 'cartier', neighbourhood: 'cartier', poi: 'loc important', place: 'loc' };
const KRANK = { city: 0, town: 0, suburb: 1, quarter: 1, village: 2, neighbourhood: 3, place: 3, poi: 4 };
let PLACES = null;
function placesList() {
  if (PLACES && PLACES.net === NET) return PLACES.list;
  const src = NET.places && NET.places.length >= 2 ? NET.places.map(p => ({ node: p.node, name: p.name, kind: p.kind })) : Object.entries(NET.nodes).filter(([, n]) => n.zone !== 'C').map(([i, n]) => ({ node: i, name: n.name, kind: 'place' }));
  const seen = new Set(), list = [];
  for (const p of src) { if (!NET.nodes[p.node] || seen.has(p.name)) continue; seen.add(p.name); list.push(Object.assign(p, { n: norm(p.name), zone: NET.nodes[p.node].zone === 'B' ? 'București' : 'Ilfov' })); }
  PLACES = { net: NET, list }; return list;
}
const placeName = (node, fallback) => { const p = placesList().find(x => x.node === node); return fallback || (p ? p.name : pname(node)); };

  const el = $('install');
  el.innerHTML = isIOS
    ? '<b>📲 Adăugați aplicația pe ecranul principal</b>Pe iPhone, avertizările funcționează doar așa: apăsați <b style="display:inline">Partajează</b> (pătratul cu săgeată) → <b style="display:inline">Adaugă pe ecranul principal</b>, apoi deschideți aplicația de pe noua iconiță. <div style="margin-top:8px"><button class="link" id="instX" style="background:none;border:none;color:var(--mute);font-weight:800">Mai târziu</button></div>'
    : '<b>📲 Instalați aplicația</b>Ca să primiți avertizările și cu aplicația închisă.<button class="btn dark" id="instGo" style="margin-top:10px">Instalați</button><button class="link" id="instX" style="background:none;border:none;color:var(--mute);font-weight:800;margin-top:6px">Mai târziu</button>';
  el.classList.add('on');
  if ($('instGo')) $('instGo').onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; el.classList.remove('on'); };
  $('instX').onclick = () => { S.installDismissed = true; save(); el.classList.remove('on'); };
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
if (isIOS && !standalone) setTimeout(showInstall, 1500);

(async function boot() {
  if (typeof E === 'undefined' || typeof PLT === 'undefined' || !window.PLT_CONFIG) { window.__pltShowError('lipsesc fișiere ale aplicației (engine/forecast/config)'); return; }
  try { const r = await fetch('graph.json', { cache: 'no-store' }); if (r.ok) { const g = await r.json(); if (g.nodes && g.edges && !E.validateNet(g).length) window.__OSM_GRAPH__ = g; } } catch (e) { }
  rebuild();
  if (!S.consent) welcome(); else show(S.live ? 'trip' : 'home');
  flush(); pullPack(); setInterval(pullPack, 15 * 60000);
  speakFromUrl();
  checkAlerts(); setInterval(checkAlerts, 30000); setInterval(() => { if (S.live && $('s-trip').classList.contains('on')) drawTrip(); if ($('s-map').classList.contains('on')) { LMT = 0; drawLiveMap(); } }, 5000); setInterval(() => { if ($('s-map').classList.contains('on')) $('mapPanel').innerHTML = mapPanel(); }, 60000);
})();
</script>
