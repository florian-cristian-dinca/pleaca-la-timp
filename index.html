<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pleacă la timp – avertizare de ambuteiaj</title>
<meta name="theme-color" content="#0b4ea2">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pleacă la timp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link href="vendor/fonts/overpass.css" rel="stylesheet">
<style>
:root{color-scheme:only light;--bg:#e9edf1;--card:#fff;--ink:#1f262e;--mute:#5b6672;--line:#d6dce2;--soft:#f1f4f7;
  --sign:#0b4ea2;--sign2:#093f84;--g:#147a42;--gl:#1fa35a;--gbg:#e1f3e8;--y:#9a6400;--yl:#f5a800;--ybg:#fff2cc;--r:#c3242f;--rl:#e0313d;--rbg:#fde5e7;
  --works:#ffd200;--asph:#2b3137;--asph2:#363d44;--blue:#0b4ea2;--font:"Overpass",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);font-feature-settings:"tnum" 1}
.app{max-width:520px;margin:0 auto;padding:14px 14px calc(86px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px}
header h1{font-size:19px;font-weight:900;margin:0;display:flex;align-items:center;gap:8px}
header .now{font-weight:800;color:var(--mute);font-size:15px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.kicker{font-size:13.5px;font-weight:700;color:var(--mute)}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
/* panoul „indicator rutier”: ora de plecare pentru următorul drum */
.sign{background:var(--sign);color:#fff;border-radius:14px;padding:16px 16px 14px;box-shadow:inset 0 0 0 3px var(--sign),inset 0 0 0 5px #fff;position:relative}
.sign .sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:700;font-size:14.5px;opacity:.92}
.sign .lead{font-size:15px;font-weight:700;margin-top:10px}
.sign .tm{font-size:64px;font-weight:900;line-height:.95;letter-spacing:-.02em;margin:2px 0 6px}
.sign .sub{font-size:15px;font-weight:600}
.sign .sub b{font-weight:800}
.semal{display:inline-flex;align-items:center;gap:8px;font-weight:800;white-space:nowrap}.sema{display:inline-flex;gap:4px;background:#1b2228;border-radius:999px;padding:4px 6px;flex:none}
.sema i{width:13px;height:13px;border-radius:50%;background:#3d464f}
.sema i.on.r{background:var(--rl);box-shadow:0 0 8px var(--rl)}.sema i.on.y{background:var(--yl);box-shadow:0 0 8px var(--yl)}.sema i.on.g{background:var(--gl);box-shadow:0 0 8px var(--gl)}
.level{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px;margin:12px 0 2px}
.level.g{background:var(--gbg);color:var(--g)}.level.y{background:var(--ybg);color:var(--y)}.level.r{background:var(--rbg);color:var(--r)}
.msg{font-size:19px;font-weight:800;line-height:1.3;margin:6px 0 4px}
.why{font-size:15px;color:var(--mute);margin-top:6px}
.big{font-size:44px;font-weight:900;line-height:1}
.opts{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.opt{padding:11px 2px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.opt .t{font-size:26px;font-weight:900;min-width:78px}
.opt.best .t{color:var(--g)}
.opt b{display:block;font-size:15.5px}.opt span{font-size:14px;color:var(--mute)}
.band{margin-top:14px}
.band .bar{display:flex;gap:2px;height:30px}
.band .bar div{flex:1;border-radius:4px;cursor:pointer;position:relative}
.band .bar div.sel{outline:3px solid var(--ink);outline-offset:1px}
.band .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:700;margin-top:4px}
.band .info{font-size:14.5px;margin-top:8px;min-height:22px;font-weight:700}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--mute);margin-top:6px;flex-wrap:wrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
details{margin-top:4px;border-top:1px solid var(--line)}summary{font-weight:800;color:var(--sign);cursor:pointer;list-style:none;padding:12px 0 10px;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;line-height:1}details[open]>summary::after{content:"–"}
.alertline{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14.5px}
/* următoarele drumuri, compacte */
.next{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}.next:last-child{border:none}
.next .nt{font-size:24px;font-weight:900;min-width:70px}.next b{display:block;font-size:15px}.next span{font-size:13.5px;color:var(--mute)}
.next .lamp{width:14px;height:14px;border-radius:50%;flex:none;margin-left:auto}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font:800 17px var(--font);cursor:pointer;margin-top:10px}
.btn.go{background:var(--g);color:#fff}.btn.dark{background:var(--sign);color:#fff}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--rbg);color:var(--r)}
.field{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.field small{display:block;font-size:12.5px;color:var(--mute);font-weight:700}
.field select,.field input{width:100%;border:none;background:transparent;font:700 16px var(--font);color:var(--ink);outline:none}
.days{display:flex;gap:6px;margin:4px 0 10px}.days button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font:800 13px var(--font);cursor:pointer;color:var(--mute)}.days button.on{border-color:var(--sign);background:var(--sign);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:6px 0 12px}.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px 0;font:800 14px var(--font);cursor:pointer;color:var(--mute)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.rep{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.repb{background:var(--asph2);border:1px solid #47505a;border-radius:12px;padding:11px 4px 9px;font:800 13px var(--font);cursor:pointer;color:#fff}.repb .e{display:block;font-size:24px;margin-bottom:3px}
.repb:active{background:#4a535c}
.muted{color:var(--mute);font-size:14px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}.item small{display:block;color:var(--mute)}
.tag{font-weight:800;font-size:13px;border-radius:8px;padding:4px 9px}.tag.ok{background:var(--gbg);color:var(--g)}.tag.no{background:var(--rbg);color:var(--r)}.tag.na{background:var(--soft);color:var(--mute)}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:13px ui-monospace,monospace}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:9}
.tabs div{display:flex;max-width:520px;width:100%}
.tabs button{flex:1;border:none;background:none;padding:9px 0 11px;font:800 12.5px var(--font);color:var(--mute);cursor:pointer;position:relative}.tabs button .e{display:block;font-size:21px;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--sign)}.tabs button.on .e{filter:none;opacity:1}.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--sign)}
.overlay{position:fixed;inset:0;background:rgba(31,38,46,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}.overlay.on{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;max-width:520px;width:100%;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14.5px}.chk input{width:22px;height:22px;flex:none;accent-color:var(--sign)}
.banner{position:sticky;top:8px;z-index:8;background:var(--asph);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;display:none;font-weight:800}.banner.on{display:block}
.install{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font-size:14.5px;display:none}.install.on{display:block}.install b{display:block;font-size:16px;margin-bottom:4px}
.pk{position:relative}.pkrow{display:flex;gap:6px;align-items:center}.pkq{flex:1;border:none;background:transparent;font:700 16px var(--font);color:var(--ink);outline:none;min-width:0;padding:2px 0}
.pkgeo{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 8px;font-size:16px;cursor:pointer;flex:none}
.pkl{position:absolute;left:-12px;right:-12px;top:calc(100% + 8px);background:#fff;border-radius:12px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(31,38,46,.18);z-index:30;overflow:hidden}
.pkl:empty{display:none}.pkl button{display:block;width:100%;text-align:left;border:none;background:#fff;padding:11px 14px;border-bottom:1px solid var(--soft);font:inherit;color:var(--ink);cursor:pointer}
.pkl button:hover,.pkl button:focus{background:var(--soft)}.pkl b{display:block;font-size:15.5px}.pkl span{font-size:12.5px;color:var(--mute)}.pke{padding:12px 14px;color:var(--mute);font-size:14px}
.rmap{width:100%;height:300px;border-radius:12px;background:#eef1f4;display:block;margin-top:4px}
.ropt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft);cursor:pointer}.ropt:last-child{border:none}
.ropt i{width:14px;height:14px;border-radius:4px;flex:none;margin-top:4px}.ropt b{display:block}.ropt span{font-size:13.5px;color:var(--mute)}.ropt.sel b{text-decoration:underline}
.mapwrap{position:relative}#liveMap{width:100%;height:58vh;min-height:320px;border-radius:16px;background:#eef1f4;display:block;touch-action:none}
.mapbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}.mapbtns button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font:800 20px var(--font);cursor:pointer;color:var(--ink)}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}.mlegend i{display:inline-block;width:14px;height:5px;border-radius:3px;margin-right:4px;vertical-align:middle}
.alist .item{align-items:flex-start}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--asph);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.chip{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800}
/* pe drum: ecran „asfalt”, citibil dintr-o privire */
.trip{background:var(--asph);color:#fff;border:none;padding:16px 14px}
.trip .muted,.trip .kicker{color:#aab4be}
.trip .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.trip .dest{font-weight:700;font-size:15px;color:#d5dce3}
.trip .eta{font-size:62px;font-weight:900;line-height:.95;margin-top:4px}
.trip .etal{font-size:13.5px;color:#aab4be;font-weight:700}
.face{width:74px;height:74px;flex:none;text-align:center}.face svg{width:74px;height:74px;display:block}.face b{display:block;font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid #47505a;border-bottom:1px solid #47505a}
.stats>div{padding:9px 8px 8px;border-right:1px solid #47505a}.stats>div:nth-child(3n){border-right:none}.stats>div:nth-child(n+4){border-top:1px solid #47505a}
.stats small{display:block;color:#aab4be;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b{font-size:22px;font-weight:900}.stats b small{display:inline;font-size:12px;color:#d5dce3}
.road{display:grid;grid-template-columns:58px 1fr;gap:12px;margin-top:10px;min-height:236px}
.road .lane{position:relative;border-radius:10px;background:#1d2227;overflow:hidden}
.road .lane .sec{position:absolute;left:0;right:0}
.road .lane .sec::before,.road .lane .sec::after{content:"";position:absolute;top:0;bottom:0;width:5px}
.road .lane .sec::before{left:5px}.road .lane .sec::after{right:5px}
.road .lane .sec.g::before,.road .lane .sec.g::after{background:var(--gl)}.road .lane .sec.y::before,.road .lane .sec.y::after{background:var(--yl)}.road .lane .sec.r::before,.road .lane .sec.r::after{background:var(--rl)}
.road .lane .mid{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(to top,#fff 0 12px,transparent 12px 24px);opacity:.75}
.road .lane .car{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:22px}
.road .lane .pin{position:absolute;left:50%;transform:translate(-50%,50%);width:26px;height:26px}
.road .parts{display:flex;flex-direction:column;min-height:236px}
.road .part{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #47505a}.road .part:last-child{border:none}
.road .part svg{width:40px;height:40px;flex:none}.road .part b{display:block;font-size:15px}.road .part span{font-size:13.5px;color:#d5dce3}
.fb{display:flex;gap:8px;margin:4px 0 10px 40px}.fb button{flex:1;padding:9px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;font:700 14px 'Overpass',sans-serif}
.inc{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #47505a;font-size:14.5px}.inc svg{width:24px;height:24px;flex:none}
.trip .note{border-radius:10px;padding:9px 11px;margin-top:10px;font-size:14.5px;font-weight:600}
.trip .rmap{background:#e9edf1;margin-top:12px}
.trip details{border-color:#47505a}.trip summary{color:#9cc3ff}
.trip .ropt{border-color:#47505a}.trip .ropt span{color:#aab4be}
.trip .btn.ghost{background:var(--asph2);color:#fff;border-color:#47505a}
.trip .mapbtns button{background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2 .btn{margin-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mpick{position:fixed;inset:0;background:#fff;z-index:25;display:none;flex-direction:column}.mpick.on{display:flex}
.mphead{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.mphead button{border:none;background:var(--soft);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.mpf{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line)}.mpf button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font:700 13px var(--font);cursor:pointer}.mpf button.on{background:var(--sign);color:#fff;border-color:var(--sign)}
.mpwrap{position:relative;flex:1}#mpCanvas{width:100%;height:100%;display:block;touch-action:none}
.mpbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.mpbar b{display:block}.mpbar span{font-size:13px;color:var(--mute)}
.pkmap{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 8px;font-size:16px;cursor:pointer;flex:none}
</style>
</head>
<body>
<div class="app">
  <header><h1>Pleacă la timp</h1><span class="now" id="clock"></span></header>
  <div class="banner" id="banner"></div>
  <div class="install" id="install"></div>
  <div class="screen on" id="s-home"></div>
  <div class="screen" id="s-map"></div>
  <div class="screen" id="s-week"></div>

</div>

  <button data-s="home" class="on"><span class="e">🔔</span>Avertizări</button>

</div></nav>
<div class="mpick" id="mapPick"><div class="mphead"><button id="mpClose" aria-label="Închide">✕</button><b>Alegeți destinația pe hartă</b></div><div class="mpf" id="mpFilters"></div>
  <div class="mpwrap"><canvas id="mpCanvas"></canvas><div class="mapbtns"><button id="mpIn" aria-label="Mărește">+</button><button id="mpOut" aria-label="Micșorează">−</button></div></div><div class="mpbar" id="mpBar"></div></div>
<div class="overlay" id="welcome"><div class="modal" id="welcomeBody"></div></div>
<div id="toast"></div>
<script>
(function () {
  function spinner() {
    if (document.getElementById('updov')) return;
    var st = document.createElement('style'); st.textContent = '@keyframes pltspin{to{transform:rotate(360deg)}}';
    document.head.appendChild(st);
    var o = document.createElement('div'); o.id = 'updov';
    o.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(242,239,233,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:800 18px system-ui,sans-serif;color:#1b1f24';
    o.innerHTML = '<div style="width:56px;height:56px;border:6px solid #d6e2f5;border-top-color:#1d4ed8;border-radius:50%;animation:pltspin .9s linear infinite"></div><div>Se actualizează aplicația…</div><div style="font:600 14px system-ui,sans-serif;color:#6b7177">Durează câteva secunde. Datele dumneavoastră rămân.</div>';
    (document.body || document.documentElement).appendChild(o);
  }
  function repair() {
    spinner();
    var p = [new Promise(function (r) { setTimeout(r, 900); })]; // rotița rămâne vizibilă cel puțin o clipă
    try { if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); })); } catch (e) { }
    try { if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })); } catch (e) { }
    Promise.all(p).then(function () { location.reload(); }, function () { location.reload(); });
  }
  window.__pltRepair = repair;
  function show(msg) {
    if (document.getElementById('errbox')) return;
    var d = document.createElement('div'); d.id = 'errbox';
    d.style.cssText = 'position:fixed;left:12px;right:12px;top:70px;z-index:99;background:#fff;color:#1b1f24;border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);font:15px/1.4 system-ui,sans-serif';
    d.innerHTML = '<b style="font-size:17px">Aplicația nu s-a încărcat complet</b><p style="margin:8px 0">De obicei se rezolvă cu o actualizare.</p><button id="errfix" style="width:100%;border:none;border-radius:14px;padding:14px;background:#15803d;color:#fff;font-weight:800;font-size:16px">Actualizează aplicația</button><p style="margin:10px 0 0;font-size:12px;color:#6b7177;word-break:break-word">Detaliu tehnic: ' + String(msg).replace(/[<>&]/g, '') + '</p>';
    (document.body || document.documentElement).appendChild(d);
    document.getElementById('errfix').onclick = repair;
  }
  window.addEventListener('error', function (e) { show((e.message || 'eroare') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason || 'promisiune respinsă'); });
  window.__pltShowError = show;
})();
</script>

<script>
'use strict';
const $ = id => document.getElementById(id);
const fmt = m => { m = Math.round(m); const d = ((m % 1440) + 1440) % 1440; return String(Math.floor(d / 60)).padStart(2, '0') + ':' + String(d % 60).padStart(2, '0'); };

    if (placed.some(q => Math.hypot(q[0] - x, q[1] - y) < 30 * dpr)) continue; placed.push([x, y]);
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 14 * dpr, 0, 7); g.fill(); g.strokeStyle = '#0b4ea2'; g.lineWidth = 2 * dpr; g.stroke();
    g.font = `${15 * dpr}px sans-serif`; g.fillText(POI_ICON[p.cat] || '📍', x, y + 1); MP.vis.push({ p, x, y }); }
  if (MP.me) { const x = X(MP.me.lon), y = Y(MP.me.lat); g.fillStyle = '#0b4ea2'; g.beginPath(); g.arc(x, y, 8 * dpr, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 3 * dpr; g.stroke(); }
  if (MP.sel) { const x = X(MP.sel.lon), y = Y(MP.sel.lat); g.fillStyle = '#c3242f'; g.beginPath(); g.arc(x, y - 18 * dpr, 11 * dpr, 0, 7); g.fill(); g.beginPath(); g.moveTo(x - 7 * dpr, y - 12 * dpr); g.lineTo(x, y); g.lineTo(x + 7 * dpr, y - 12 * dpr); g.fill(); }
  g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.fillStyle = 'rgba(31,38,46,.55)'; g.font = `600 ${10 * dpr}px "Overpass"`; g.fillText('© OpenStreetMap contributors', 8 * dpr, H - 8 * dpr);
}
function mpBar() { const s = MP.sel; $('mpBar').innerHTML = s ? `<div><b>${esc(s.name)}</b><span>${esc(s.sub || '')}</span></div><button class="btn go" id="mpOk" style="margin:0;width:auto;padding:12px 18px">Aleg acest loc</button>` : '<span class="muted">Atingeți un magazin, un spital sau orice punct de pe hartă.</span>';
  if (s) $('mpOk').onclick = () => { const cb = MP.cb; closeMapPick(); cb && cb(s); }; }
function closeMapPick() { $('mapPick').classList.remove('on'); }
function mpTap(x, y) {
  const v = mpView(), dpr = v.dpr; let best = null, bd = 24 * dpr;
  for (const o of MP.vis || []) { const d = Math.hypot(o.x - x, o.y - y); if (d < bd) { bd = d; best = o.p; } }
  if (best) MP.sel = { lat: best.pt.lat, lon: best.pt.lon, name: best.name + (best.near ? ', ' + best.near : ''), sub: (CAT[best.cat] || 'loc') + (best.near ? ', lângă ' + best.near : ''), node: best.node };
  else { const lat = v.latAt(y), lon = v.lonAt(x), n = nearestRoadNode(lat, lon) || (nearestNode(lat, lon) || {}).node; if (!n) { toast('Punctul e în afara zonei pilotului.'); return; }
    let st = null, sd = 0.25; if (ADR) for (const a of ADR) { const d = E.haversine({ lat, lon }, a); if (d < sd) { sd = d; st = a; } }
    const near = nearestPlaceName(lat, lon); MP.sel = { lat, lon, node: n, name: st ? st.name + (st.near ? ', ' + st.near : '') : 'Punct ales pe hartă' + (near ? ', lângă ' + near : ''), sub: st ? 'aproape de punctul atins' : 'punctul atins pe hartă' }; }
  drawMapPick(); mpBar();
}
function bindMapPick() {
  const cv = $('mpCanvas'); let down = null, moved = false, pinch = null; const pts = new Map();
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); down = { x: e.clientX, y: e.clientY, lat: MP.lat, lon: MP.lon }; moved = false;
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), km: MP.km }; } };
  cv.onpointermove = e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) { const [a, b] = [...pts.values()]; MP.km = Math.max(0.6, Math.min(40, pinch.km * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)))); moved = true; drawMapPick(); return; }
    if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; if (Math.hypot(dx, dy) > 6) moved = true;
    if (moved) { const v = mpView(), dpr = v.dpr; MP.lon = down.lon - dx * dpr / v.sc; MP.lat = down.lat + dy * dpr / v.sy; drawMapPick(); } };
  cv.onpointerup = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (down && !moved) { const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1; mpTap((e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr); } if (!pts.size) down = null; };
  cv.onwheel = e => { e.preventDefault(); MP.km = Math.max(0.6, Math.min(40, MP.km * (e.deltaY > 0 ? 1.25 : 0.8))); drawMapPick(); };
  $('mpIn').onclick = () => { MP.km = Math.max(0.6, MP.km / 1.6); drawMapPick(); }; $('mpOut').onclick = () => { MP.km = Math.min(40, MP.km * 1.6); drawMapPick(); };
  $('mpClose').onclick = closeMapPick;
  $('mpFilters').innerHTML = [[null, 'Toate'], ['shop', '🛒 Magazine'], ['hospital', '🏥 Spitale'], ['clinic', '⚕️ Clinici'], ['townhall', '🏛️ Primării'], ['school', '🏫 Școli'], ['fuel', '⛽ Benzinării'], ['mall', '🏬 Mall-uri']]
    .map(([k, t]) => `<button data-f="${k || ''}" class="${(MP.filter || '') === (k || '') ? 'on' : ''}">${t}</button>`).join('');
  $('mpFilters').querySelectorAll('button').forEach(b => b.onclick = () => { MP.filter = b.dataset.f || null; $('mpFilters').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); drawMapPick(); });
  loadAdr().then(() => { if ($('mapPick').classList.contains('on')) drawMapPick(); });
}

function show(s) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  document.querySelectorAll('.screen').forEach(x => x.classList.toggle('on', x.id === 's-' + s));
  if (s !== 'map') stopMapGeo();
  if (s === 'home') renderHome(); if (s === 'map') renderMap(); if (s === 'week') renderWeek(); if (s === 'trip') renderTrip(); if (s === 'set') renderSet(); if (s === 'fam') { renderFam(); pullFamily().then(() => { if ($('s-fam').classList.contains('on')) renderFam(); }); }
  scrollTo(0, 0);
}
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.s); };

/* ---------- Aplicație instalabilă (PWA) ---------- */
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let deferredPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
function showInstall() {
  if (standalone || S.installDismissed) return;
  const el = $('install');
  el.innerHTML = isIOS
    ? '<b>📲 Adăugați aplicația pe ecranul principal</b>Pe iPhone, avertizările funcționează doar așa: apăsați <b style="display:inline">Partajează</b> (pătratul cu săgeată) → <b style="display:inline">Adaugă pe ecranul principal</b>, apoi deschideți aplicația de pe noua iconiță. <div style="margin-top:8px"><button class="link" id="instX" style="background:none;border:none;color:var(--mute);font-weight:800">Mai târziu</button></div>'
    : '<b>📲 Instalați aplicația</b>Ca să primiți avertizările și cu aplicația închisă. Dacă Google Play Protect afișează un avertisment, alegeți „Detalii” → „Instalați oricum”, sau din meniul ⋮ al Chrome alegeți „Adăugați la ecranul de pornire” → „Comandă rapidă”.<button class="btn dark" id="instGo" style="margin-top:10px">Instalați</button><button class="link" id="instX" style="background:none;border:none;color:var(--mute);font-weight:800;margin-top:6px">Mai târziu</button>';
  el.classList.add('on');
  if ($('instGo')) $('instGo').onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; el.classList.remove('on'); };
  $('instX').onclick = () => { S.installDismissed = true; save(); el.classList.remove('on'); };
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
if (isIOS && !standalone) setTimeout(showInstall, 1500);

(async function boot() {
  if (typeof E === 'undefined' || typeof PLT === 'undefined' || !window.PLT_CONFIG) { window.__pltShowError('lipsesc fișiere ale aplicației (engine/forecast/config)'); return; }
  try { const r = await fetch('graph.json', { cache: 'no-store' }); if (r.ok) { const g = await r.json(); if (g.nodes && g.edges && !E.validateNet(g).length) window.__OSM_GRAPH__ = g; } } catch (e) { }
  rebuild();
  if (!S.consent) welcome(); else show(S.live ? 'trip' : 'home');
  flush(); pullPack(); setInterval(pullPack, 15 * 60000);
  speakFromUrl();
  bindMapPick();
  pullTraffic(true); setInterval(() => pullTraffic(), 300000);
  if (S.consent) pullFamily(); setInterval(() => { if (!S.consent) return; if ($('s-fam').classList.contains('on')) pullFamily().then(() => { if ($('s-fam').classList.contains('on') && !document.activeElement.closest('#s-fam input')) renderFam(); }); else if (Date.now() - ((S.fam && S.fam.at) || 0) > 120000) pullFamily(); }, 10000);
  checkAlerts(); setInterval(checkAlerts, 30000); setInterval(() => { if (S.live && $('s-trip').classList.contains('on')) drawTrip(); if ($('s-map').classList.contains('on')) { LMT = 0; drawLiveMap(); } }, 5000); setInterval(() => { if ($('s-map').classList.contains('on')) $('mapPanel').innerHTML = mapPanel(); }, 60000);
})();
</script>
